<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="batPhoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="batScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#172554;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="batGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="batYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <filter id="batShadow">
      <feDropShadow dx="1" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="batGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="chargeGlow">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="#f0fdf4" opacity="0.3"/>
  <circle cx="150" cy="150" r="110" fill="#dcfce7" opacity="0.2"/>

  <!-- Phone -->
  <g filter="url(#batShadow)">
    <rect x="85" y="30" width="130" height="240" rx="14" fill="url(#batPhoneBody)"/>
    <rect x="85" y="30" width="130" height="240" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Screen -->
    <rect x="93" y="48" width="114" height="205" rx="3" fill="url(#batScreen)"/>
    <!-- Camera -->
    <circle cx="150" cy="39" r="3.5" fill="#1f2937"/>
    <!-- Home indicator -->
    <rect x="133" y="260" width="34" height="3" rx="1.5" fill="#334155"/>
  </g>

  <!-- Battery icon on screen -->
  <g transform="translate(115, 75)">
    <!-- Battery outline -->
    <rect x="5" y="0" width="60" height="100" rx="6" fill="none" stroke="#4ade80" stroke-width="3"/>
    <!-- Battery terminal -->
    <rect x="22" y="-8" width="26" height="10" rx="3" fill="none" stroke="#4ade80" stroke-width="3"/>
    <!-- Battery fill (animated look with gradient) -->
    <rect x="10" y="35" width="50" height="60" rx="3" fill="url(#batGreen)" opacity="0.8"/>
    <rect x="10" y="55" width="50" height="40" rx="3" fill="#16a34a" opacity="0.3"/>
    <!-- Percentage text -->
    <text x="35" y="72" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#fff">75%</text>
  </g>

  <!-- Charging bolt -->
  <g transform="translate(138, 190)" filter="url(#batGlow)">
    <polygon points="15,0 5,22 14,22 8,40 28,15 18,15 25,0" fill="url(#batYellow)"/>
  </g>

  <!-- Charging cable at bottom -->
  <g>
    <!-- USB-C port -->
    <rect x="140" y="268" width="20" height="6" rx="2" fill="#4b5563"/>
    <!-- Cable -->
    <path d="M150,274 L150,295 Q150,300 145,300 L80,300" stroke="#6b7280" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Cable connector -->
    <rect x="138" y="270" width="24" height="8" rx="3" fill="#9ca3af"/>
  </g>

  <!-- Energy rings -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="#22c55e" stroke-width="0.8" opacity="0.15"/>
  <circle cx="150" cy="150" r="125" fill="none" stroke="#22c55e" stroke-width="0.5" opacity="0.1"/>

  <!-- Small battery icons floating -->
  <g opacity="0.15" fill="#22c55e">
    <g transform="translate(30, 60) scale(0.4)">
      <rect x="5" y="0" width="30" height="50" rx="4" stroke="#22c55e" stroke-width="3" fill="none"/>
      <rect x="14" y="-5" width="12" height="7" rx="2" fill="#22c55e"/>
      <rect x="9" y="20" width="22" height="26" rx="2" fill="#22c55e"/>
    </g>
    <g transform="translate(240, 80) scale(0.35)">
      <rect x="5" y="0" width="30" height="50" rx="4" stroke="#22c55e" stroke-width="3" fill="none"/>
      <rect x="14" y="-5" width="12" height="7" rx="2" fill="#22c55e"/>
      <rect x="9" y="10" width="22" height="36" rx="2" fill="#22c55e"/>
    </g>
  </g>

  <!-- Sparkles -->
  <g fill="#f59e0b">
    <polygon points="60,130 61.5,125 63,130 68,131.5 63,133 61.5,138 60,133 55,131.5" opacity="0.6"/>
    <polygon points="245,180 246,177 247,180 250,181 247,182 246,185 245,182 242,181" opacity="0.5"/>
    <polygon points="50,220 51.5,216 53,220 57,221.5 53,223 51.5,227 50,223 46,221.5" opacity="0.4"/>
  </g>
</svg>