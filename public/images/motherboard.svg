<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="mbBoard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#064e3b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mbChip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mbGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="mbCopper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:0.8"/>
    </linearGradient>
    <filter id="mbShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="#f0fdf4" opacity="0.2"/>

  <!-- PCB Board -->
  <g filter="url(#mbShadow)">
    <rect x="30" y="30" width="240" height="240" rx="8" fill="url(#mbBoard)"/>
    <rect x="30" y="30" width="240" height="240" rx="8" fill="none" stroke="#047857" stroke-width="1"/>

    <!-- PCB Traces - horizontal -->
    <line x1="30" y1="70" x2="95" y2="70" stroke="#d97706" stroke-width="1" opacity="0.4"/>
    <line x1="30" y1="90" x2="80" y2="90" stroke="#d97706" stroke-width="0.8" opacity="0.35"/>
    <line x1="200" y1="80" x2="270" y2="80" stroke="#d97706" stroke-width="1" opacity="0.4"/>
    <line x1="210" y1="100" x2="270" y2="100" stroke="#d97706" stroke-width="0.8" opacity="0.35"/>
    <line x1="30" y1="200" x2="90" y2="200" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="30" y1="220" x2="100" y2="220" stroke="#d97706" stroke-width="1" opacity="0.4"/>
    <line x1="195" y1="210" x2="270" y2="210" stroke="#d97706" stroke-width="0.8" opacity="0.35"/>
    <line x1="205" y1="230" x2="270" y2="230" stroke="#d97706" stroke-width="1" opacity="0.4"/>

    <!-- PCB Traces - vertical -->
    <line x1="60" y1="30" x2="60" y2="95" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="80" y1="30" x2="80" y2="85" stroke="#d97706" stroke-width="1" opacity="0.35"/>
    <line x1="240" y1="30" x2="240" y2="90" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="60" y1="200" x2="60" y2="270" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="240" y1="205" x2="240" y2="270" stroke="#d97706" stroke-width="0.8" opacity="0.35"/>

    <!-- Diagonal traces -->
    <line x1="95" y1="95" x2="110" y2="110" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="195" y1="95" x2="210" y2="80" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="95" y1="195" x2="80" y2="210" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>
    <line x1="195" y1="195" x2="210" y2="210" stroke="#d97706" stroke-width="0.8" opacity="0.3"/>

    <!-- Main CPU Chip (center) -->
    <rect x="105" y="105" width="90" height="90" rx="4" fill="url(#mbChip)"/>
    <rect x="105" y="105" width="90" height="90" rx="4" fill="none" stroke="#374151" stroke-width="1"/>
    <!-- CPU label -->
    <text x="150" y="145" text-anchor="middle" font-family="monospace" font-size="10" fill="#9ca3af">CPU</text>
    <text x="150" y="160" text-anchor="middle" font-family="monospace" font-size="7" fill="#6b7280">A16 PRO</text>
    <!-- CPU pins top -->
    <g fill="url(#mbGold)">
      <rect x="115" y="98" width="4" height="8" rx="0.5"/>
      <rect x="123" y="98" width="4" height="8" rx="0.5"/>
      <rect x="131" y="98" width="4" height="8" rx="0.5"/>
      <rect x="139" y="98" width="4" height="8" rx="0.5"/>
      <rect x="147" y="98" width="4" height="8" rx="0.5"/>
      <rect x="155" y="98" width="4" height="8" rx="0.5"/>
      <rect x="163" y="98" width="4" height="8" rx="0.5"/>
      <rect x="171" y="98" width="4" height="8" rx="0.5"/>
      <rect x="179" y="98" width="4" height="8" rx="0.5"/>
    </g>
    <!-- CPU pins bottom -->
    <g fill="url(#mbGold)">
      <rect x="115" y="194" width="4" height="8" rx="0.5"/>
      <rect x="123" y="194" width="4" height="8" rx="0.5"/>
      <rect x="131" y="194" width="4" height="8" rx="0.5"/>
      <rect x="139" y="194" width="4" height="8" rx="0.5"/>
      <rect x="147" y="194" width="4" height="8" rx="0.5"/>
      <rect x="155" y="194" width="4" height="8" rx="0.5"/>
      <rect x="163" y="194" width="4" height="8" rx="0.5"/>
      <rect x="171" y="194" width="4" height="8" rx="0.5"/>
      <rect x="179" y="194" width="4" height="8" rx="0.5"/>
    </g>
    <!-- CPU pins left -->
    <g fill="url(#mbGold)">
      <rect x="98" y="115" width="8" height="4" rx="0.5"/>
      <rect x="98" y="125" width="8" height="4" rx="0.5"/>
      <rect x="98" y="135" width="8" height="4" rx="0.5"/>
      <rect x="98" y="145" width="8" height="4" rx="0.5"/>
      <rect x="98" y="155" width="8" height="4" rx="0.5"/>
      <rect x="98" y="165" width="8" height="4" rx="0.5"/>
      <rect x="98" y="175" width="8" height="4" rx="0.5"/>
      <rect x="98" y="185" width="8" height="4" rx="0.5"/>
    </g>
    <!-- CPU pins right -->
    <g fill="url(#mbGold)">
      <rect x="194" y="115" width="8" height="4" rx="0.5"/>
      <rect x="194" y="125" width="8" height="4" rx="0.5"/>
      <rect x="194" y="135" width="8" height="4" rx="0.5"/>
      <rect x="194" y="145" width="8" height="4" rx="0.5"/>
      <rect x="194" y="155" width="8" height="4" rx="0.5"/>
      <rect x="194" y="165" width="8" height="4" rx="0.5"/>
      <rect x="194" y="175" width="8" height="4" rx="0.5"/>
      <rect x="194" y="185" width="8" height="4" rx="0.5"/>
    </g>

    <!-- RAM Chip (top-left) -->
    <rect x="42" y="42" width="45" height="30" rx="2" fill="url(#mbChip)"/>
    <rect x="42" y="42" width="45" height="30" rx="2" fill="none" stroke="#374151" stroke-width="0.8"/>
    <text x="64" y="60" text-anchor="middle" font-family="monospace" font-size="7" fill="#9ca3af">RAM</text>
    <circle cx="50" cy="50" r="1.5" fill="#d97706" opacity="0.6"/>

    <!-- GPU Chip (top-right) -->
    <rect x="215" y="42" width="45" height="30" rx="2" fill="url(#mbChip)"/>
    <rect x="215" y="42" width="45" height="30" rx="2" fill="none" stroke="#374151" stroke-width="0.8"/>
    <text x="237" y="60" text-anchor="middle" font-family="monospace" font-size="7" fill="#9ca3af">GPU</text>

    <!-- Storage Chip (bottom-left) -->
    <rect x="42" y="230" width="50" height="28" rx="2" fill="url(#mbChip)"/>
    <rect x="42" y="230" width="50" height="28" rx="2" fill="none" stroke="#374151" stroke-width="0.8"/>
    <text x="67" y="248" text-anchor="middle" font-family="monospace" font-size="6" fill="#9ca3af">NAND</text>

    <!-- Power IC (bottom-right) -->
    <rect x="210" y="230" width="48" height="28" rx="2" fill="url(#mbChip)"/>
    <rect x="210" y="230" width="48" height="28" rx="2" fill="none" stroke="#374151" stroke-width="0.8"/>
    <text x="234" y="248" text-anchor="middle" font-family="monospace" font-size="6" fill="#9ca3af">PWR IC</text>

    <!-- Capacitors -->
    <g fill="#4b5563" stroke="#6b7280" stroke-width="0.5">
      <rect x="44" y="90" width="8" height="5" rx="1"/>
      <rect x="56" y="90" width="8" height="5" rx="1"/>
      <rect x="68" y="90" width="8" height="5" rx="1"/>
      <rect x="44" y="175" width="8" height="5" rx="1"/>
      <rect x="56" y="175" width="8" height="5" rx="1"/>
      <rect x="230" y="90" width="8" height="5" rx="1"/>
      <rect x="245" y="90" width="8" height="5" rx="1"/>
      <rect x="230" y="175" width="8" height="5" rx="1"/>
      <rect x="245" y="175" width="8" height="5" rx="1"/>
    </g>

    <!-- Resistors -->
    <g>
      <rect x="44" y="130" width="10" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
      <rect x="44" y="150" width="10" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
      <rect x="248" y="130" width="10" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
      <rect x="248" y="150" width="10" height="4" rx="1" fill="#1f2937" stroke="#374151" stroke-width="0.5"/>
    </g>

    <!-- Solder pads / vias -->
    <g fill="#d97706" opacity="0.5">
      <circle cx="95" cy="70" r="2.5"/>
      <circle cx="95" cy="90" r="2.5"/>
      <circle cx="205" cy="70" r="2.5"/>
      <circle cx="205" cy="90" r="2.5"/>
      <circle cx="95" cy="210" r="2.5"/>
      <circle cx="95" cy="230" r="2.5"/>
      <circle cx="205" cy="210" r="2.5"/>
      <circle cx="205" cy="230" r="2.5"/>
    </g>

    <!-- Connector pins (bottom edge) -->
    <g fill="url(#mbGold)">
      <rect x="110" y="262" width="6" height="8" rx="1"/>
      <rect x="122" y="262" width="6" height="8" rx="1"/>
      <rect x="134" y="262" width="6" height="8" rx="1"/>
      <rect x="146" y="262" width="6" height="8" rx="1"/>
      <rect x="158" y="262" width="6" height="8" rx="1"/>
      <rect x="170" y="262" width="6" height="8" rx="1"/>
      <rect x="182" y="262" width="6" height="8" rx="1"/>
    </g>

    <!-- Mounting holes -->
    <circle cx="38" cy="38" r="4" fill="#047857" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="262" cy="38" r="4" fill="#047857" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="38" cy="262" r="4" fill="#047857" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="262" cy="262" r="4" fill="#047857" stroke="#d97706" stroke-width="1.5"/>
  </g>
</svg>