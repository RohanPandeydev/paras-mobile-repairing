<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="phoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="toolMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9ca3af;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#d1d5db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6b7280;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0"/>
    </linearGradient>
    <filter id="shadow1">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="200" r="180" fill="#f0f4ff" opacity="0.5"/>
  <circle cx="200" cy="200" r="150" fill="#e0e7ff" opacity="0.3"/>

  <!-- Phone body -->
  <g filter="url(#shadow1)">
    <rect x="130" y="60" width="140" height="280" rx="16" ry="16" fill="url(#phoneBody)"/>
    <rect x="130" y="60" width="140" height="280" rx="16" ry="16" fill="none" stroke="#374151" stroke-width="2"/>
    <!-- Screen -->
    <rect x="140" y="80" width="120" height="230" rx="4" ry="4" fill="url(#screenGrad)"/>
    <!-- Screen content lines -->
    <rect x="155" y="100" width="70" height="4" rx="2" fill="#60a5fa" opacity="0.6"/>
    <rect x="155" y="112" width="50" height="4" rx="2" fill="#60a5fa" opacity="0.4"/>
    <rect x="155" y="124" width="80" height="4" rx="2" fill="#60a5fa" opacity="0.3"/>
    <rect x="155" y="145" width="90" height="50" rx="4" fill="#2563eb" opacity="0.5"/>
    <rect x="155" y="205" width="60" height="4" rx="2" fill="#60a5fa" opacity="0.4"/>
    <rect x="155" y="217" width="75" height="4" rx="2" fill="#60a5fa" opacity="0.3"/>
    <rect x="155" y="229" width="45" height="4" rx="2" fill="#60a5fa" opacity="0.3"/>
    <!-- Camera notch -->
    <circle cx="200" cy="72" r="4" fill="#1f2937"/>
    <!-- Home indicator -->
    <rect x="180" y="320" width="40" height="4" rx="2" fill="#374151"/>
  </g>

  <!-- Screwdriver (left side) -->
  <g transform="translate(45, 120) rotate(-30, 50, 120)">
    <!-- Handle -->
    <rect x="38" y="150" width="24" height="90" rx="6" fill="url(#handleGrad)"/>
    <rect x="40" y="155" width="20" height="5" rx="1" fill="#fbbf24" opacity="0.6"/>
    <rect x="40" y="165" width="20" height="5" rx="1" fill="#fbbf24" opacity="0.6"/>
    <rect x="40" y="175" width="20" height="5" rx="1" fill="#fbbf24" opacity="0.6"/>
    <!-- Shaft -->
    <rect x="46" y="80" width="8" height="75" rx="2" fill="url(#toolMetal)"/>
    <!-- Tip -->
    <polygon points="46,80 54,80 52,65 48,65" fill="#9ca3af"/>
    <!-- Metal collar -->
    <rect x="42" y="145" width="16" height="10" rx="2" fill="#9ca3af"/>
  </g>

  <!-- Tweezers (right side) -->
  <g transform="translate(290, 100) rotate(25, 30, 100)">
    <!-- Left arm -->
    <path d="M25,40 Q20,100 15,170 L18,172 Q23,105 28,42 Z" fill="url(#toolMetal)"/>
    <!-- Right arm -->
    <path d="M35,40 Q40,100 45,170 L42,172 Q37,105 32,42 Z" fill="url(#toolMetal)"/>
    <!-- Joint -->
    <ellipse cx="30" cy="42" rx="8" ry="5" fill="#9ca3af"/>
    <!-- Tips -->
    <path d="M15,170 L13,180 L18,172 Z" fill="#6b7280"/>
    <path d="M45,170 L47,180 L42,172 Z" fill="#6b7280"/>
  </g>

  <!-- Small screws scattered -->
  <g fill="#9ca3af">
    <circle cx="110" cy="290" r="4" />
    <line x1="107" y1="290" x2="113" y2="290" stroke="#6b7280" stroke-width="1"/>
    <line x1="110" y1="287" x2="110" y2="293" stroke="#6b7280" stroke-width="1"/>

    <circle cx="300" cy="310" r="3.5"/>
    <line x1="297.5" y1="310" x2="302.5" y2="310" stroke="#6b7280" stroke-width="1"/>
    <line x1="300" y1="307.5" x2="300" y2="312.5" stroke="#6b7280" stroke-width="1"/>

    <circle cx="90" cy="180" r="3"/>
    <line x1="87.5" y1="180" x2="92.5" y2="180" stroke="#6b7280" stroke-width="1"/>
    <line x1="90" y1="177.5" x2="90" y2="182.5" stroke="#6b7280" stroke-width="1"/>
  </g>

  <!-- Gear icon (top-right decorative) -->
  <g transform="translate(320, 60)" opacity="0.15" fill="#1e40af">
    <path d="M20,8 L22,0 L28,0 L30,8 L37,5 L41,10 L35,16 L40,22 L35,27 L28,23 L30,30 L22,30 L20,23 L13,27 L9,22 L15,16 L9,10 L13,5 Z"/>
    <circle cx="25" cy="15" r="6" fill="#f0f4ff"/>
  </g>

  <!-- Wrench icon (bottom-left decorative) -->
  <g transform="translate(50, 330)" opacity="0.12" fill="#1e40af">
    <path d="M5,25 L20,10 Q25,0 35,5 L30,15 L35,20 L40,15 Q50,20 45,30 L25,50 Q20,55 15,50 L5,35 Q0,30 5,25 Z"/>
  </g>

  <!-- Sparkle effects -->
  <g fill="#f59e0b" filter="url(#glow)">
    <polygon points="160,55 162,50 164,55 169,57 164,59 162,64 160,59 155,57" opacity="0.8"/>
    <polygon points="280,150 281,147 282,150 285,151 282,152 281,155 280,152 277,151" opacity="0.6"/>
    <polygon points="100,140 101.5,136 103,140 107,141.5 103,143 101.5,147 100,143 96,141.5" opacity="0.7"/>
  </g>
</svg>