<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="scrPhoneBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="scrCracked" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#94a3b8;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#64748b;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="scrNew" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="scrArrow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:1"/>
    </linearGradient>
    <filter id="scrShadow">
      <feDropShadow dx="1" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="scrGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="150" cy="150" r="140" fill="#f8fafc" opacity="0.4"/>

  <!-- Cracked phone (left) -->
  <g filter="url(#scrShadow)" transform="translate(-20, 0)">
    <rect x="40" y="50" width="100" height="200" rx="12" fill="url(#scrPhoneBody)"/>
    <rect x="40" y="50" width="100" height="200" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Cracked screen -->
    <rect x="48" y="68" width="84" height="165" rx="3" fill="url(#scrCracked)"/>
    <!-- Crack lines -->
    <path d="M60,68 L75,120 L48,160" stroke="#e2e8f0" stroke-width="1.5" fill="none"/>
    <path d="M75,120 L95,95 L132,75" stroke="#e2e8f0" stroke-width="1.2" fill="none"/>
    <path d="M75,120 L100,150 L132,180" stroke="#e2e8f0" stroke-width="1.3" fill="none"/>
    <path d="M75,120 L65,155 L70,200" stroke="#e2e8f0" stroke-width="1" fill="none"/>
    <path d="M95,95 L110,110 L115,140" stroke="#e2e8f0" stroke-width="0.8" fill="none"/>
    <path d="M100,150 L85,175 L80,233" stroke="#e2e8f0" stroke-width="0.9" fill="none"/>
    <!-- Impact point -->
    <circle cx="75" cy="120" r="3" fill="#e2e8f0" opacity="0.6"/>
    <!-- Camera -->
    <circle cx="90" cy="58" r="3" fill="#1f2937"/>
    <!-- Red X overlay -->
    <circle cx="90" cy="150" r="18" fill="#ef4444" opacity="0.2"/>
    <line x1="80" y1="140" x2="100" y2="160" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <line x1="100" y1="140" x2="80" y2="160" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Arrow -->
  <g transform="translate(130, 135)">
    <path d="M0,15 L30,15 L30,5 L50,20 L30,35 L30,25 L0,25 Z" fill="url(#scrArrow)" filter="url(#scrGlow)"/>
  </g>

  <!-- New screen (right) -->
  <g filter="url(#scrShadow)" transform="translate(20, 0)">
    <rect x="170" y="50" width="100" height="200" rx="12" fill="url(#scrPhoneBody)"/>
    <rect x="170" y="50" width="100" height="200" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>
    <!-- Clean new screen -->
    <rect x="178" y="68" width="84" height="165" rx="3" fill="url(#scrNew)"/>
    <!-- Screen content -->
    <rect x="188" y="85" width="50" height="4" rx="2" fill="#60a5fa" opacity="0.5"/>
    <rect x="188" y="95" width="64" height="4" rx="2" fill="#60a5fa" opacity="0.4"/>
    <rect x="188" y="110" width="64" height="40" rx="4" fill="#2563eb" opacity="0.4"/>
    <rect x="188" y="160" width="40" height="4" rx="2" fill="#60a5fa" opacity="0.4"/>
    <rect x="188" y="170" width="55" height="4" rx="2" fill="#60a5fa" opacity="0.3"/>
    <rect x="188" y="185" width="64" height="28" rx="6" fill="#22c55e" opacity="0.5"/>
    <rect x="198" y="194" width="44" height="4" rx="2" fill="#fff" opacity="0.7"/>
    <!-- Camera -->
    <circle cx="220" cy="58" r="3" fill="#1f2937"/>
    <!-- Home indicator -->
    <rect x="205" y="240" width="30" height="3" rx="1.5" fill="#334155"/>
    <!-- Checkmark -->
    <circle cx="220" cy="130" r="16" fill="#22c55e" opacity="0.25"/>
    <polyline points="212,130 218,136 230,122" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Sparkles on new screen -->
  <g fill="#f59e0b">
    <polygon points="280,65 281.5,60 283,65 288,66.5 283,68 281.5,73 280,68 275,66.5" opacity="0.7"/>
    <polygon points="175,55 176,52 177,55 180,56 177,57 176,60 175,57 172,56" opacity="0.5"/>
  </g>
</svg>